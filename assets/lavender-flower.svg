<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <g id="lavender-stem">
    <!-- Gentle curved main stem -->
    <path d="M 50 115 C 48 85 52 50 49 10" stroke="#D1E8B2" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Leaves at bottom -->
    <path d="M 50 95 C 40 90 32 82 28 78 C 36 82 45 88 50 93" fill="#D1E8B2" opacity="0.9"/>
    <path d="M 50 90 C 60 85 68 77 72 73 C 64 77 55 83 50 88" fill="#D1E8B2" opacity="0.9"/>
    <path d="M 49 78 C 41 73 35 66 32 62 C 39 65 46 71 49 76" fill="#D1E8B2" opacity="0.85"/>
    <path d="M 49 74 C 57 69 63 62 66 58 C 59 61 52 67 49 72" fill="#D1E8B2" opacity="0.85"/>

    <!-- Lavender Flower Buds / Clusters -->
    <!-- Tier 1 (Bottom cluster) -->
    <ellipse cx="44" cy="52" rx="4" ry="7" transform="rotate(-25 44 52)" fill="#9B7EDE"/>
    <ellipse cx="55" cy="50" rx="4" ry="7" transform="rotate(25 55 50)" fill="#B69AE8"/>
    <ellipse cx="49" cy="48" rx="3.5" ry="6" fill="#EDE5FA"/>

    <!-- Tier 2 -->
    <ellipse cx="43" cy="42" rx="3.8" ry="6.5" transform="rotate(-20 43 42)" fill="#B69AE8"/>
    <ellipse cx="55" cy="40" rx="3.8" ry="6.5" transform="rotate(20 55 40)" fill="#9B7EDE"/>
    <ellipse cx="49" cy="38" rx="3.5" ry="5.8" fill="#D8C8F6"/>

    <!-- Tier 3 -->
    <ellipse cx="44" cy="32" rx="3.5" ry="6" transform="rotate(-18 44 32)" fill="#8C67DB"/>
    <ellipse cx="54" cy="31" rx="3.5" ry="6" transform="rotate(18 54 31)" fill="#B69AE8"/>
    <ellipse cx="49" cy="29" rx="3.2" ry="5.5" fill="#EDE5FA"/>

    <!-- Tier 4 -->
    <ellipse cx="45" cy="23" rx="3.2" ry="5.5" transform="rotate(-15 45 23)" fill="#B69AE8"/>
    <ellipse cx="53" cy="22" rx="3.2" ry="5.5" transform="rotate(15 53 22)" fill="#9B7EDE"/>
    <ellipse cx="49" cy="20" rx="3" ry="5" fill="#D8C8F6"/>

    <!-- Tier 5 (Top tip) -->
    <ellipse cx="46" cy="15" rx="2.8" ry="4.5" transform="rotate(-10 46 15)" fill="#B69AE8"/>
    <ellipse cx="52" cy="14" rx="2.8" ry="4.5" transform="rotate(10 52 14)" fill="#EDE5FA"/>
    <ellipse cx="49" cy="10" rx="2.5" ry="4" fill="#9B7EDE"/>
  </g>
</svg>
